<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validaciones</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/index.js"></script>
</head>
<body>
    <div class="contenedor">
        <h1>Ingrese su Información</h1>
        <form id="formulario">
            <div class="campo nombre">
                <label>Nombre</label>
                <input type="text" id="nombre">
                <small id="nombreEstado" class="estado"></small>
            </div>
            <div class="campo email">
                <label>Email</label>
                <input type="email" id="email">
                <small id="emailEstado" class="estado"></small>
            </div>
            <div class="campo telefono">
                <label>Teléfono</label>
                <input type="text" id="telefono">
                <small id="telefonoEstado" class="estado"></small>
            </div>
            <div class="campo birthday">
                <label>Fecha de nacimiento</label>
                <input type="date" id="birthday">
                <small id="birthdayEstado" class="estado"></small>
            </div>
            <div class="campo password">
                <label>Contraseña</label>
                <input type="password" id="password">
                <small id="passwordEstado" class="estado"></small>
            </div>
            <div class="validar">
                <button type="button" id="btnvalidar">
                    Validar
                </button>
            </div>
            <a href="login.html"><p>Iniciar Sesion</p></a>
        </form>
        
    </div>
    <div id="modal" class="modal">
        <div class="modal-contenido">
            <span id="cerrar">&times;</span>
            <h2>Edad: </h2>
            <p id="mensajeEdad"></p>
        </div>
    </div>
</body>
</html>
